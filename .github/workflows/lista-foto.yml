name: Pubblica lista foto su Discord

on:
  repository_dispatch:
    types: [lista_foto]

  workflow_dispatch:

jobs:
  pubblica-lista:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Crea lista Discord
        run: |
          python3 <<'PY'
          import json

          COLORE = int("ff004f", 16)

          with open("lista-foto.json", "r", encoding="utf-8") as f:
              dati = json.load(f)

          dati = sorted(
              dati,
              key=lambda x: int(x["numero"])
          )

          totale_caricate = sum(
              1 for foto in dati
              if foto["caricata"]
          )

          riepilogo = {
              "username": "ZeroTwo",
              "embeds": [
                  {
                      "title": "📸 LISTA FOTO",
                      "description": (
                          f"**Totale foto:** {len(dati)}\n"
                          f"**Caricate:** {totale_caricate}\n"
                          f"**Non caricate:** {len(dati) - totale_caricate}"
                      ),
                      "color": COLORE
                  }
              ]
          }

          with open(
              "discord-riepilogo.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  riepilogo,
                  f,
                  ensure_ascii=False
              )

          dimensione = 20

          for i in range(0, len(dati), dimensione):

              gruppo = dati[i:i + dimensione]

              righe = []

              for foto in gruppo:
                  stato = (
                      "✅ caricata"
                      if foto["caricata"]
                      else "❌ non caricata"
                  )

                  righe.append(
                      f'**Foto {foto["numero"]}** — '
                      f'{foto["nome"]} = {stato}'
                  )

              inizio = gruppo[0]["numero"]
              fine = gruppo[-1]["numero"]

              payload = {
                  "username": "ZeroTwo",
                  "embeds": [
                      {
                          "title": f"📋 FOTO {inizio} - {fine}",
                          "description": "\n".join(righe),
                          "color": COLORE
                      }
                  ]
              }

              numero_file = (i // dimensione) + 1

              with open(
                  f"discord-lista-{numero_file}.json",
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      payload,
                      f,
                      ensure_ascii=False
                  )

          PY

      - name: Pubblica lista su Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -e

          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "ERRORE: DISCORD_WEBHOOK_URL non configurato"
            exit 1
          fi

          HTTP_CODE=$(curl \
            -sS \
            -o discord-response.json \
            -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "User-Agent: ZeroTwo-GitHubActions/1.0" \
            --data-binary @discord-riepilogo.json \
            "${DISCORD_WEBHOOK_URL}?wait=true")

          echo "Riepilogo Discord HTTP: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            cat discord-response.json || true
            echo "ERRORE pubblicazione riepilogo"
            exit 1
          fi

          for FILE in discord-lista-*.json; do

            echo "Invio $FILE"

            HTTP_CODE=$(curl \
              -sS \
              -o discord-response.json \
              -w "%{http_code}" \
              -X POST \
              -H "Content-Type: application/json" \
              -H "User-Agent: ZeroTwo-GitHubActions/1.0" \
              --data-binary @"$FILE" \
              "${DISCORD_WEBHOOK_URL}?wait=true")

            echo "Discord HTTP: $HTTP_CODE"

            if [ "$HTTP_CODE" != "200" ]; then
              cat discord-response.json || true
              echo "ERRORE pubblicazione $FILE"
              exit 1
            fi

          done

          echo "Lista pubblicata correttamente su Discord."

          rm -f discord-riepilogo.json
          rm -f discord-lista-*.json
          rm -f discord-response.json
