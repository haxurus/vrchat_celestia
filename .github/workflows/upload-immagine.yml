name: Carica immagine da ZeroTwo

on:
  repository_dispatch:
    types: [upload_immagine]

permissions:
  contents: write

concurrency:
  group: immagini-repository
  cancel-in-progress: false

jobs:
  carica-immagine:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Controlla numero foto
        env:
          NUMERO: ${{ github.event.client_payload.numero }}
        run: |
          python3 <<'PY'
          import json
          import os
          import sys

          try:
              numero = int(os.environ["NUMERO"])
          except:
              print("ERRORE: numero non valido")
              sys.exit(1)

          if numero < 1 or numero > 80:
              print("ERRORE: il numero foto deve essere compreso tra 1 e 80")
              sys.exit(1)

          with open("lista-foto.json", "r", encoding="utf-8") as f:
              dati = json.load(f)

          foto = next(
              (x for x in dati if int(x["numero"]) == numero),
              None
          )

          if foto is None:
              print(
                  f"ERRORE: foto numero {numero} "
                  f"non presente in lista-foto.json"
              )
              sys.exit(1)

          print(f'Foto trovata: {numero}. {foto["nome"]}')
          PY

      - name: Verifica cartella immagini_in_mappa
        run: |
          set -e

          if [ ! -d "immagini_in_mappa" ]; then
            echo "ERRORE: la cartella immagini_in_mappa non esiste."
            exit 1
          fi

          echo "Cartella immagini_in_mappa trovata."

      - name: Scarica e rinomina immagine
        env:
          IMAGE_URL: ${{ github.event.client_payload.immagine }}
          NUMERO: ${{ github.event.client_payload.numero }}
        run: |
          set -e

          if [[ ! "$NUMERO" =~ ^[0-9]+$ ]]; then
            echo "ERRORE: numero non valido"
            exit 1
          fi

          if (( NUMERO < 1 || NUMERO > 80 )); then
            echo "ERRORE: il numero foto deve essere compreso tra 1 e 80"
            exit 1
          fi

          curl -fL "$IMAGE_URL" -o immagine_temp

          TIPO=$(file --mime-type -b immagine_temp)

          case "$TIPO" in
            image/png)
              EXT="png"
              ;;
            image/jpeg)
              EXT="jpg"
              ;;
            image/webp)
              EXT="webp"
              ;;
            image/gif)
              EXT="gif"
              ;;
            image/avif)
              EXT="avif"
              ;;
            *)
              echo "ERRORE: formato non supportato: $TIPO"
              rm -f immagine_temp
              exit 1
              ;;
          esac

          rm -f "immagini_in_mappa/${NUMERO}.png"
          rm -f "immagini_in_mappa/${NUMERO}.jpg"
          rm -f "immagini_in_mappa/${NUMERO}.jpeg"
          rm -f "immagini_in_mappa/${NUMERO}.webp"
          rm -f "immagini_in_mappa/${NUMERO}.gif"
          rm -f "immagini_in_mappa/${NUMERO}.avif"

          mv immagine_temp "immagini_in_mappa/${NUMERO}.${EXT}"

          echo "Immagine salvata come immagini_in_mappa/${NUMERO}.${EXT}"

      - name: Sincronizza lista con immagini esistenti
        env:
          NUMERO: ${{ github.event.client_payload.numero }}
        run: |
          python3 <<'PY'
          import json
          import os

          CARTELLA = "immagini_in_mappa"

          ESTENSIONI = {
              ".png",
              ".jpg",
              ".jpeg",
              ".webp",
              ".gif",
              ".avif"
          }

          presenti = set()

          for nome_file in os.listdir(CARTELLA):

              percorso = os.path.join(
                  CARTELLA,
                  nome_file
              )

              if not os.path.isfile(percorso):
                  continue

              nome, estensione = os.path.splitext(nome_file)

              if (
                  nome.isdigit()
                  and estensione.lower() in ESTENSIONI
                  and 1 <= int(nome) <= 80
              ):
                  presenti.add(int(nome))

          with open("lista-foto.json", "r", encoding="utf-8") as f:
              dati = json.load(f)

          dati = [
              foto for foto in dati
              if 1 <= int(foto["numero"]) <= 80
          ]

          for foto in dati:

              numero = int(foto["numero"])

              foto["caricata"] = numero in presenti

              if foto["caricata"]:
                  print(f"✅ Foto {numero} trovata")
              else:
                  print(f"❌ Foto {numero} non trovata")

          dati = sorted(
              dati,
              key=lambda x: int(x["numero"])
          )

          with open("lista-foto.json", "w", encoding="utf-8") as f:
              json.dump(
                  dati,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          with open("LISTA_FOTO.md", "w", encoding="utf-8") as f:

              f.write("# LISTA FOTO\n\n")

              for foto in dati:

                  stato = (
                      "✅ caricata"
                      if foto["caricata"]
                      else "❌ non caricata"
                  )

                  f.write(
                      f'- **Foto {foto["numero"]}** — '
                      f'{foto["nome"]} = {stato}\n\n'
                  )

          print("")
          print(
              f"Totale immagini riconosciute: {len(presenti)}"
          )
          PY

      - name: Salva modifiche nel repository
        id: salva_upload
        env:
          NUMERO: ${{ github.event.client_payload.numero }}
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          FOTO=$(find immagini_in_mappa -maxdepth 1 -type f \( \
            -name "${NUMERO}.png" -o \
            -name "${NUMERO}.jpg" -o \
            -name "${NUMERO}.jpeg" -o \
            -name "${NUMERO}.webp" -o \
            -name "${NUMERO}.gif" -o \
            -name "${NUMERO}.avif" \
          \) | head -n 1)

          if [ -z "$FOTO" ]; then

            echo "caricata=false" >> "$GITHUB_OUTPUT"

            echo \
              "ERRORE: foto ${NUMERO} non trovata in immagini_in_mappa."

            exit 1
          fi

          git add -A

          if git diff --cached --quiet; then

            echo "Nessuna modifica necessaria."

          else

            git commit \
              -m "Caricata foto ${NUMERO} in immagini_in_mappa"

            echo "Recupero eventuali modifiche nuove da GitHub..."

            git fetch origin main
            git rebase origin/main

            echo "Invio modifiche a GitHub..."

            git push origin HEAD:main

          fi

          git fetch origin main

          if git ls-tree -r origin/main --name-only | \
            grep -Eq \
            "^immagini_in_mappa/${NUMERO}\.(png|jpg|jpeg|webp|gif|avif)$"
          then

            echo "caricata=true" >> "$GITHUB_OUTPUT"

            echo \
              "Foto ${NUMERO} verificata in immagini_in_mappa su GitHub."

          else

            echo "caricata=false" >> "$GITHUB_OUTPUT"

            echo \
              "ERRORE: foto ${NUMERO} non presente in immagini_in_mappa su GitHub."

            exit 1

          fi

      - name: Crea lista Discord divisa
        if: steps.salva_upload.outputs.caricata == 'true'
        run: |
          python3 <<'PY'
          import json

          COLORE = int("ff004f", 16)

          with open("lista-foto.json", "r", encoding="utf-8") as f:
              dati = json.load(f)

          dati = [
              foto for foto in dati
              if 1 <= int(foto["numero"]) <= 80
          ]

          dati = sorted(
              dati,
              key=lambda x: int(x["numero"])
          )

          totale_caricate = sum(
              1
              for foto in dati
              if foto["caricata"]
          )

          riepilogo = {
              "username": "ZeroTwo",
              "embeds": [
                  {
                      "title": "📸 LISTA FOTO",
                      "description": (
                          f"**Totale foto:** {len(dati)}\n"
                          f"**Caricate:** {totale_caricate}\n"
                          f"**Non caricate:** "
                          f"{len(dati) - totale_caricate}"
                      ),
                      "color": COLORE
                  }
              ]
          }

          with open(
              "discord-riepilogo.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  riepilogo,
                  f,
                  ensure_ascii=False
              )

          dimensione = 20

          for i in range(0, len(dati), dimensione):

              gruppo = dati[i:i + dimensione]

              righe = []

              for foto in gruppo:

                  stato = (
                      "✅ caricata"
                      if foto["caricata"]
                      else "❌ non caricata"
                  )

                  righe.append(
                      f'**Foto {foto["numero"]}** — '
                      f'{foto["nome"]} = {stato}'
                  )

              inizio = gruppo[0]["numero"]
              fine = gruppo[-1]["numero"]

              payload = {
                  "username": "ZeroTwo",
                  "embeds": [
                      {
                          "title": (
                              f"📋 FOTO {inizio} - {fine}"
                          ),
                          "description": "\n".join(righe),
                          "color": COLORE
                      }
                  ]
              }

              numero_file = (
                  i // dimensione
              ) + 1

              with open(
                  f"discord-lista-{numero_file}.json",
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      payload,
                      f,
                      ensure_ascii=False
                  )

          PY

      - name: Aggiorna lista su Discord
        if: steps.salva_upload.outputs.caricata == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -e

          if [ -z "$DISCORD_WEBHOOK_URL" ]; then

            echo \
              "ERRORE: DISCORD_WEBHOOK_URL non configurato"

            exit 1

          fi

          # Se esiste ancora il vecchio blocco 81-100, eliminalo una volta.
          if [ -f "discord-id-lista-5.txt" ] && [ -s "discord-id-lista-5.txt" ]; then

            OLD_MESSAGE_ID=$(tr -d '\r\n' < "discord-id-lista-5.txt")

            echo "Elimino il vecchio messaggio Discord FOTO 81-100..."

            DELETE_CODE=$(curl \
              -sS \
              -o /dev/null \
              -w "%{http_code}" \
              -X DELETE \
              -H "User-Agent: ZeroTwo-GitHubActions/1.0" \
              "${DISCORD_WEBHOOK_URL}/messages/${OLD_MESSAGE_ID}")

            echo "Discord DELETE vecchio blocco HTTP: $DELETE_CODE"

            if [ "$DELETE_CODE" = "204" ] || [ "$DELETE_CODE" = "404" ]; then
              rm -f "discord-id-lista-5.txt"
            else
              echo "ERRORE: impossibile eliminare il vecchio blocco 81-100."
              exit 1
            fi

          fi

          sincronizza_messaggio () {

            PAYLOAD="$1"
            ID_FILE="$2"

            echo "----------------------------------------"
            echo "Payload: $PAYLOAD"
            echo "ID file: $ID_FILE"

            if [ -f "$ID_FILE" ] && [ -s "$ID_FILE" ]; then

              MESSAGE_ID=$(tr -d '\r\n' < "$ID_FILE")

              echo \
                "Aggiorno messaggio Discord ${MESSAGE_ID}"

              HTTP_CODE=$(curl \
                -sS \
                -o discord-response.json \
                -w "%{http_code}" \
                -X PATCH \
                -H "Content-Type: application/json" \
                -H "User-Agent: ZeroTwo-GitHubActions/1.0" \
                --data-binary @"$PAYLOAD" \
                "${DISCORD_WEBHOOK_URL}/messages/${MESSAGE_ID}")

              echo "Discord PATCH HTTP: $HTTP_CODE"

              if [ "$HTTP_CODE" = "200" ]; then

                echo "Messaggio aggiornato correttamente."

                rm -f discord-response.json

                return 0

              fi

              echo \
                "PATCH fallita. Creo un nuovo messaggio."

              cat discord-response.json || true

            fi

            HTTP_CODE=$(curl \
              -sS \
              -o discord-response.json \
              -w "%{http_code}" \
              -X POST \
              -H "Content-Type: application/json" \
              -H "User-Agent: ZeroTwo-GitHubActions/1.0" \
              --data-binary @"$PAYLOAD" \
              "${DISCORD_WEBHOOK_URL}?wait=true")

            echo "Discord POST HTTP: $HTTP_CODE"

            if [ "$HTTP_CODE" != "200" ]; then

              cat discord-response.json || true

              echo \
                "ERRORE: impossibile creare il messaggio Discord."

              exit 1

            fi

            python3 - "$ID_FILE" <<'PY'
          import json
          import sys

          id_file = sys.argv[1]

          with open(
              "discord-response.json",
              "r",
              encoding="utf-8"
          ) as f:
              risposta = json.load(f)

          message_id = risposta["id"]

          with open(
              id_file,
              "w",
              encoding="utf-8"
          ) as f:
              f.write(message_id)

          print(
              "Salvato ID messaggio:",
              message_id,
              "in",
              id_file
          )
          PY

            rm -f discord-response.json

          }

          sincronizza_messaggio \
            "discord-riepilogo.json" \
            "discord-id-riepilogo.txt"

          for FILE in discord-lista-*.json; do

            NUMERO_LISTA=$(
              basename "$FILE" .json |
              sed 's/discord-lista-//'
            )

            sincronizza_messaggio \
              "$FILE" \
              "discord-id-lista-${NUMERO_LISTA}.txt"

          done

          rm -f discord-riepilogo.json
          rm -f discord-lista-*.json
          rm -f discord-response.json

      - name: Salva ID messaggi Discord
        if: steps.salva_upload.outputs.caricata == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then

            echo "Nessun nuovo ID Discord da salvare."
            exit 0

          fi

          git commit \
            -m "Aggiornati ID messaggi lista Discord"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Conferma caricamento riuscito su Discord
        if: always() && steps.salva_upload.outputs.caricata == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NUMERO: ${{ github.event.client_payload.numero }}
        run: |
          set -e

          TEMPO=30

          HTTP_CODE=$(curl \
            -sS \
            -o discord-conferma.json \
            -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "User-Agent: ZeroTwo-GitHubActions/1.0" \
            -d "{\"content\":\"✅ **Foto ${NUMERO} caricata correttamente su GitHub in immagini_in_mappa.**\"}" \
            "${DISCORD_WEBHOOK_URL}?wait=true")

          echo "Invio messaggio Discord HTTP: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then

            cat discord-conferma.json || true

            echo \
              "ERRORE: impossibile inviare il messaggio Discord"

            exit 1

          fi

          MESSAGE_ID=$(python3 -c \
            'import json; print(json.load(open("discord-conferma.json"))["id"])')

          echo "ID messaggio: $MESSAGE_ID"

          echo \
            "Attendo ${TEMPO} secondi prima di cancellarlo..."

          sleep "$TEMPO"

          DELETE_CODE=$(curl \
            -sS \
            -o /dev/null \
            -w "%{http_code}" \
            -X DELETE \
            -H "User-Agent: ZeroTwo-GitHubActions/1.0" \
            "${DISCORD_WEBHOOK_URL}/messages/${MESSAGE_ID}")

          echo \
            "Cancellazione Discord HTTP: $DELETE_CODE"

          if [ "$DELETE_CODE" != "204" ]; then

            echo \
              "ERRORE: impossibile cancellare il messaggio Discord"

            exit 1

          fi

          echo "Messaggio cancellato correttamente."

          rm -f discord-conferma.json

      - name: Conferma caricamento fallito su Discord
        if: always() && steps.salva_upload.outputs.caricata != 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NUMERO: ${{ github.event.client_payload.numero }}
        run: |
          curl \
            --fail-with-body \
            -sS \
            -H "Content-Type: application/json" \
            -H "User-Agent: ZeroTwo-GitHubActions/1.0" \
            -d \
            "{\"content\":\"❌ **ERRORE: la foto ${NUMERO} NON è stata caricata su GitHub.** Controlla GitHub Actions.\"}" \
            "$DISCORD_WEBHOOK_URL"
